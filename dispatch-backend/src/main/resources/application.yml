server:
  port: 8080

spring:
  application:
    name: dispatch-backend
  datasource:
    url: jdbc:h2:mem:greenride;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

geofence:
  service:
    url: http://localhost:8000/api/geofence
